import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 发布签名配置：keystore 与密码只从本机读取，不写进代码、不提交仓库。
// 凭据文件默认位置：C:/Users/Administrator/.config/opencode/signing/credentials.txt
// 也可用环境变量覆盖：LINGXI_STORE_FILE / LINGXI_STORE_PASSWORD / LINGXI_KEY_ALIAS / LINGXI_KEY_PASSWORD
def credFile = new File(
    System.getenv('LINGXI_CRED_FILE') ?:
        "${System.getProperty('user.home')}/.config/opencode/signing/credentials.txt"
)
def cred = new Properties()
if (credFile.exists()) {
    credFile.withInputStream { cred.load(it) }
}

android {
    namespace 'com.lingxi.chat'
    compileSdk 35

    signingConfigs {
        release {
            if (cred['keystore']) {
                storeFile file(cred['keystore'])
                storePassword cred['storepass']
                keyAlias cred['alias']
                keyPassword cred['keypass']
            }
        }
    }

    defaultConfig {
        applicationId "com.lingxi.chat"
        minSdk 24
        targetSdk 35
        versionCode 43
        versionName "1.175"
        // 所有对外请求都是 HTTPS，不开明文流量（仅 debug 包为方便本地 mock 放开）
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            // 正式包：签名 + R8 混淆压缩，体积更小且不暴露源码
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig cred['keystore'] ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // 协程：异步层（替换裸Thread/Handler），随 APK 内置，不额外走网络
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // 手机操控的 Shizuku 通道：只用 AIDL 客户端，库随 APK 内置，运行期不再联网
    implementation 'dev.rikka.shizuku:api:13.1.5'
}